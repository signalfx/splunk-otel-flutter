# GitLab CI/CD configuration for Splunk OpenTelemetry Flutter SDK
# 
# Setup Instructions:
# 1. Generate credentials locally (one-time, requires Google OAuth login):
#    - Run `flutter pub login` on your local machine
#    - This opens a browser for Google OAuth authentication with pub.dev
#    - After successful login, credentials are saved to:
#      macOS/Linux: ~/Library/Application Support/dart/pub-credentials.json
#      Windows: %APPDATA%\dart\pub-credentials.json
#    - Note: `flutter pub token add` does NOT authenticate - it only stores existing tokens
# 2. Store credentials in GitLab CI/CD Variables:
#    - In GitLab, go to Settings > CI/CD > Variables
#    - Add a variable named PUB_CREDENTIALS
#    - Copy the ENTIRE contents of pub-credentials.json (the full JSON)
#      macOS: cat ~/Library/Application\ Support/dart/pub-credentials.json | pbcopy
#    - Paste it as the PUB_CREDENTIALS variable value
#    - Optionally base64-encode it: `cat ~/Library/Application\ Support/dart/pub-credentials.json | base64`
#    - Set the variable as "Protected" and "Masked" for security
# 3. CI will automatically use these credentials to authenticate with pub.dev
#
# Release Process:
# 1. Update version in pubspec.yaml files to the version you want to release
#    - For dev: 1.0.0-dev.1, 1.0.0-dev.2, etc.
#    - For alpha: 1.0.0-alpha.1, 1.0.0-alpha.2, etc.
#    - For stable: 1.0.0, 1.0.1, 1.1.0, etc.
# 2. Commit and push to GitLab (can be from GitHub mirror)
# 3. Go to CI/CD > Pipelines > Run pipeline
# 4. Select the branch/commit you want to release from
# 5. Run the "dry_run" job manually to test
# 6. If dry run succeeds, run the "release" job to publish to pub.dev
#
# Note: The version is read directly from pubspec.yaml files.
# Make sure both packages have the same version before releasing.

default:
  image: 'ghcr.io/cirruslabs/flutter:3.32.8'

stages:
  - setup
  - build
  - sauce-test
  - dry-run
  - release

# Setup stage - install dependencies
setup_dependencies:
  stage: setup
  script:
    - flutter --version
    - flutter pub get
    - cd packages/splunk_otel_flutter/splunk_otel_flutter_platform_interface && flutter pub get
    - cd ../../../
    - cd packages/splunk_otel_flutter/splunk_otel_flutter && flutter pub get
    - cd ../../../
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .dart_tool/
      - .flutter/
      - .pub-cache/

# Build artifacts stage - validate packages
build_artifacts:
  stage: build
  script:
    - flutter pub get
    - |
      # Validate platform interface package
      echo "=== Validating splunk_otel_flutter_platform_interface ==="
      cd packages/splunk_otel_flutter/splunk_otel_flutter_platform_interface
      flutter pub get
      flutter analyze
      flutter test
      cd ../../../
    - |
      # Validate main package
      echo "=== Validating splunk_otel_flutter ==="
      cd packages/splunk_otel_flutter/splunk_otel_flutter
      flutter pub get
      flutter analyze
      flutter test
      cd ../../../
  artifacts:
    paths:
      - packages/splunk_otel_flutter/splunk_otel_flutter_platform_interface/
      - packages/splunk_otel_flutter/splunk_otel_flutter/
    expire_in: 1 week

sauce_appium_purchase_flow_android:
  stage: sauce-test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never
  variables:
    SAUCE_API_BASE: "https://api.us-west-1.saucelabs.com"
    APP_APK: "splunk_otel_flutter_root_example_app/build/app/outputs/flutter-apk/app-debug.apk"
    STORAGE_IDS_FILE: "$CI_PROJECT_DIR/.sauce-appium-purchase-storage-files"
    REALM: "mon0"
    RUM_ACCESS_TOKEN: ""
    SAUCE_DEVICE_NAME: "Samsung Galaxy S26 Ultra"
    SAUCE_PLATFORM_VERSION: "16"
    SAUCE_APPIUM_VERSION: "appium2-20250901"
    SAUCE_PRIVATE_DEVICES_ONLY: "true"
    SAUCE_RESIGNING_ENABLED: "false"
    APP_PACKAGE_ID: "com.splunk.rum.flutter.root.exampleapp.root_example_app"
    INITIAL_WAIT_SECONDS: "10"
    TELEMETRY_SETTLE_SECONDS: "120"
  script:
    - |
      set -e

      if [ -z "$SAUCE_USERNAME" ] || [ -z "$SAUCE_ACCESS_KEY" ]; then
        echo "Set SAUCE_USERNAME and SAUCE_ACCESS_KEY GitLab CI/CD variables before running this job."
        exit 1
      fi

      if [ -z "$REALM" ] || [ -z "$RUM_ACCESS_TOKEN" ]; then
        echo "Set REALM and RUM_ACCESS_TOKEN GitLab CI/CD variables before running this job."
        exit 1
      fi

      if ! command -v node >/dev/null 2>&1; then
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update
          apt-get install -y nodejs
        else
          echo "Node.js is required to run the Appium purchase-flow test."
          exit 1
        fi
      fi
      node --version

      flutter --version
      flutter precache --android

      dart pub global activate melos
      export PATH="$PATH:$HOME/.pub-cache/bin"
      melos bootstrap

      cd splunk_otel_flutter_root_example_app
      flutter build apk --debug \
        "--dart-define=ENABLE_APPIUM_SEMANTICS=true" \
        "--dart-define=REALM=$REALM" \
        "--dart-define=RUM_ACCESS_TOKEN=$RUM_ACCESS_TOKEN"
      cd "$CI_PROJECT_DIR"

      app_name="smart-cinema-purchase-flow-app-${CI_PIPELINE_ID}.apk"
      app_response="$(curl --fail --silent --show-error --location \
        --user "$SAUCE_USERNAME:$SAUCE_ACCESS_KEY" \
        --request POST "$SAUCE_API_BASE/v1/storage/upload" \
        --form "payload=@$APP_APK" \
        --form "name=$app_name" \
        --form "description=RUM positive purchase flow app for GitLab pipeline $CI_PIPELINE_ID")"
      app_file_id="$(echo "$app_response" | grep -o '"id"[[:space:]]*:[[:space:]]*"[^"]*"' | head -n 1 | sed 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')"
      if [ -z "$app_file_id" ]; then
        echo "Sauce upload did not return an app file ID."
        exit 1
      fi
      echo "APP_FILE_ID=$app_file_id" > "$STORAGE_IDS_FILE"

      export SAUCE_APP="storage:$app_file_id"
      cd splunk_otel_flutter_root_example_app
      bash scripts/sauce_appium_purchase_flow_android.sh
  after_script:
    - |
      if [ -f "$STORAGE_IDS_FILE" ]; then
        . "$STORAGE_IDS_FILE"
      fi

      # Remove the uploaded APK from Sauce storage after the job finishes.
      if [ -n "$APP_FILE_ID" ]; then
        curl --fail --silent --show-error --location \
          --user "$SAUCE_USERNAME:$SAUCE_ACCESS_KEY" \
          --request DELETE "$SAUCE_API_BASE/v1/storage/files/$APP_FILE_ID" || true
      fi
  artifacts:
    when: always
    paths:
      - splunk_otel_flutter_root_example_app/artifacts/
    expire_in: 14 days


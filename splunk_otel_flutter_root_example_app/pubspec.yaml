name: splunk_otel_flutter_root_example_app
description: "Splunk Flutter Agent root example app "
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  splunk_otel_flutter: ^1.1.0
  splunk_otel_flutter_session_replay: ^1.1.0
  # Not published, so it is referenced by path rather than by version.
  splunk_otel_flutter_session_replay_devtools:
    path: ../packages/splunk_otel_flutter_session_replay/splunk_otel_flutter_session_replay_devtools
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - res/movie_images/cover/
    - res/movie_images/detail/
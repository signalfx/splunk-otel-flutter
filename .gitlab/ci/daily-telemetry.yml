# Daily Sauce telemetry jobs for the SmartCinema root example app.
#
# Required scheduled-pipeline variables:
#   RUN_DAILY_TELEMETRY=true
#   RUM_ACCESS_TOKEN=<Splunk RUM token>
#   SAUCE_USERNAME=<Sauce username>
#   SAUCE_ACCESS_KEY=<Sauce access key>
#
# Optional scheduled-pipeline variables:
#   REALM=mon0
#   SAUCE_REGION=us-west-1
#   SAUCE_APPIUM_APP_NAME=smart-cinema-appium-<id>.apk
#   SAUCE_TELEMETRY_APP_NAME=smart-cinema-telemetry-suite-<id>.apk
#   SAUCE_TELEMETRY_TEST_APP_NAME=smart-cinema-telemetry-suite-test-<id>.apk
#   SAUCE_DEVICE_NAME="Google Pixel 7 Pro GoogleAPI Emulator"
#   SAUCE_PLATFORM_VERSION=15.0

variables:
  TELEMETRY_APP_DIR: "splunk_otel_flutter_root_example_app"
  TELEMETRY_TEST_TARGET: "integration_test/telemetry_suite_test.dart"
  REALM: "mon0"
  SAUCE_REGION: "us-west-1"
  SAUCE_BUILD_PREFIX: "smart-cinema-daily-telemetry"
  SAUCECTL_VERSION: "0.205.3"
  TELEMETRY_SETTLE_SECONDS: "180"
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"

.daily_telemetry_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_DAILY_TELEMETRY == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_DAILY_TELEMETRY == "true"'
    - when: never

.daily_telemetry_flutter:
  extends: .daily_telemetry_rules
  image: 'cirrusci/flutter:stable'
  timeout: 60m
  cache:
    key: "daily-telemetry-flutter-${CI_COMMIT_REF_SLUG}"
    paths:
      - .dart_tool/
      - .pub-cache/
      - splunk_otel_flutter_root_example_app/.dart_tool/
      - splunk_otel_flutter_root_example_app/build/

daily_telemetry_upload_appium_apk:
  extends: .daily_telemetry_flutter
  stage: telemetry-build
  script:
    - cd "$TELEMETRY_APP_DIR"
    - export SAUCE_APPIUM_APP_NAME="${SAUCE_APPIUM_APP_NAME:-smart-cinema-appium-${CI_PIPELINE_ID}.apk}"
    - export SAUCE_APP_NAME="$SAUCE_APPIUM_APP_NAME"
    - ./tool/build_and_upload_sauce_apk.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - splunk_otel_flutter_root_example_app/build/sauce_upload_response.json
      - splunk_otel_flutter_root_example_app/build/sauce/

daily_telemetry_upload_instrumentation_apks:
  extends: .daily_telemetry_flutter
  stage: telemetry-build
  script:
    - cd "$TELEMETRY_APP_DIR"
    - export SAUCE_TELEMETRY_APP_NAME="${SAUCE_TELEMETRY_APP_NAME:-smart-cinema-telemetry-suite-${CI_PIPELINE_ID}.apk}"
    - export SAUCE_TELEMETRY_TEST_APP_NAME="${SAUCE_TELEMETRY_TEST_APP_NAME:-smart-cinema-telemetry-suite-test-${CI_PIPELINE_ID}.apk}"
    - export TEST_TARGET="$TELEMETRY_TEST_TARGET"
    - export SAUCE_APP_NAME="$SAUCE_TELEMETRY_APP_NAME"
    - export SAUCE_TEST_APP_NAME="$SAUCE_TELEMETRY_TEST_APP_NAME"
    - ./tool/build_and_upload_sauce_anr_test_apk.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - splunk_otel_flutter_root_example_app/build/sauce_anr_app_upload_response.json
      - splunk_otel_flutter_root_example_app/build/sauce_anr_test_apk_upload_response.json
      - splunk_otel_flutter_root_example_app/build/sauce/

.daily_telemetry_appium:
  extends: .daily_telemetry_rules
  image: 'node:20-bookworm-slim'
  stage: telemetry-test
  timeout: 45m
  cache:
    key: "daily-telemetry-appium-${CI_COMMIT_REF_SLUG}"
    paths:
      - splunk_otel_flutter_root_example_app/appium-crash/node_modules/
  before_script:
    - touch "$CI_PROJECT_DIR/.empty-npmrc"
    - export NPM_CONFIG_USERCONFIG="$CI_PROJECT_DIR/.empty-npmrc"
    - export NPM_CONFIG_REGISTRY="$NPM_CONFIG_REGISTRY"

daily_telemetry_hot_startup:
  extends: .daily_telemetry_appium
  needs:
    - daily_telemetry_upload_appium_apk
  script:
    - cd "$TELEMETRY_APP_DIR"
    - export SAUCE_APPIUM_APP_NAME="${SAUCE_APPIUM_APP_NAME:-smart-cinema-appium-${CI_PIPELINE_ID}.apk}"
    - export SAUCE_BUILD_NAME="${SAUCE_BUILD_NAME:-${SAUCE_BUILD_PREFIX}-${CI_PIPELINE_ID}}"
    - export SAUCE_APP_NAME="$SAUCE_APPIUM_APP_NAME"
    - export SAUCE_JOB_NAME="${SAUCE_HOT_STARTUP_JOB_NAME:-SmartCinema daily hot startup telemetry}"
    - ./tool/run_sauce_hot_startup_appium.sh

daily_telemetry_suite:
  extends: .daily_telemetry_rules
  image: 'alpine:3.20'
  stage: telemetry-test
  timeout: 45m
  needs:
    - daily_telemetry_upload_instrumentation_apks
  before_script:
    - apk add --no-cache curl tar
    - mkdir -p "$CI_PROJECT_DIR/.ci-bin"
    - curl -L -o saucectl.tar.gz "https://github.com/saucelabs/saucectl/releases/download/v${SAUCECTL_VERSION}/saucectl_${SAUCECTL_VERSION}_linux_64-bit.tar.gz"
    - tar -xzf saucectl.tar.gz
    - mv saucectl "$CI_PROJECT_DIR/.ci-bin/saucectl"
    - chmod +x "$CI_PROJECT_DIR/.ci-bin/saucectl"
    - export PATH="$CI_PROJECT_DIR/.ci-bin:$PATH"
    - saucectl --version
  script:
    - cd "$TELEMETRY_APP_DIR"
    - export SAUCE_TELEMETRY_APP_NAME="${SAUCE_TELEMETRY_APP_NAME:-smart-cinema-telemetry-suite-${CI_PIPELINE_ID}.apk}"
    - export SAUCE_TELEMETRY_TEST_APP_NAME="${SAUCE_TELEMETRY_TEST_APP_NAME:-smart-cinema-telemetry-suite-test-${CI_PIPELINE_ID}.apk}"
    - export SAUCE_BUILD_NAME="${SAUCE_BUILD_NAME:-${SAUCE_BUILD_PREFIX}-${CI_PIPELINE_ID}}"
    - mkdir -p .sauce
    - |
      cat > .sauce/telemetry-suite-ci.yml <<EOF
      apiVersion: v1alpha
      kind: espresso

      sauce:
        region: ${SAUCE_REGION}
        concurrency: 1

      espresso:
        app: storage:filename=${SAUCE_TELEMETRY_APP_NAME}
        testApp: storage:filename=${SAUCE_TELEMETRY_TEST_APP_NAME}

      suites:
        - name: SmartCinema daily telemetry suite
          testOptions:
            class:
              - com.splunk.rum.flutter.root.exampleapp.root_example_app.MainActivityTest
          devices:
            - name: "${SAUCE_DEVICE_NAME:-Google Pixel.*}"

      artifacts:
        download:
          when: always
          directory: ./build/saucectl-artifacts
      EOF
    - saucectl run -c .sauce/telemetry-suite-ci.yml --build "$SAUCE_BUILD_NAME"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - splunk_otel_flutter_root_example_app/build/saucectl-artifacts/

daily_telemetry_crash_relaunch:
  extends: .daily_telemetry_appium
  stage: telemetry-crash
  needs:
    - daily_telemetry_hot_startup
    - daily_telemetry_suite
  script:
    - cd "$TELEMETRY_APP_DIR"
    - export SAUCE_APPIUM_APP_NAME="${SAUCE_APPIUM_APP_NAME:-smart-cinema-appium-${CI_PIPELINE_ID}.apk}"
    - export SAUCE_BUILD_NAME="${SAUCE_BUILD_NAME:-${SAUCE_BUILD_PREFIX}-${CI_PIPELINE_ID}}"
    - export SAUCE_APP_NAME="$SAUCE_APPIUM_APP_NAME"
    - export SAUCE_JOB_NAME="${SAUCE_CRASH_JOB_NAME:-SmartCinema daily bad-email crash telemetry}"
    - ./tool/run_sauce_bad_email_crash_appium.sh

name: splunk_otel_flutter
description: "Splunk OpenTelemetry Flutter plugin for real user monitoring (RUM). Track app performance, crashes, network requests, and user interactions."
version: 1.1.0
repository: https://github.com/signalfx/splunk-otel-flutter/tree/main/packages/splunk_otel_flutter/splunk_otel_flutter
homepage: https://github.com/signalfx/splunk-otel-flutter

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Locked to the 1.1.x line. The Pigeon codec is a wire contract shared with
  # the platform interface, so the app-facing plugin and its interface must move
  # together. An open caret could float the interface to a newer minor than the
  # native codec was built against. Bump both bounds together every release.
  splunk_otel_flutter_platform_interface: '>=1.1.0 <1.2.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.splunk.rum.flutter
        pluginClass: SplunkOtelFlutterPlugin
      ios:
        pluginClass: SplunkOtelFlutterPlugin
        supportsSwift: true
        deploymentTarget: "15.0"
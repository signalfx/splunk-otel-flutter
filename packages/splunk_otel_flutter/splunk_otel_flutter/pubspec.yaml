name: splunk_otel_flutter
description: "Splunk OpenTelemetry Flutter plugin for real user monitoring (RUM). Track app performance, crashes, network requests, and user interactions."
version: 1.0.3
repository: https://github.com/signalfx/splunk-otel-flutter/tree/main/packages/splunk_otel_flutter/splunk_otel_flutter
homepage: https://github.com/signalfx/splunk-otel-flutter

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Floor raised to 1.1.0: this package calls navigationTrack(attributes:),
  # which was introduced in platform-interface 1.1.0. Allowing older 1.0.x
  # would compile against the {required String screenName}-only API and fail.
  splunk_otel_flutter_platform_interface: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.splunk.rum.flutter
        pluginClass: SplunkOtelFlutterPlugin
      ios:
        pluginClass: SplunkOtelFlutterPlugin
        supportsSwift: true
        deploymentTarget: "15.0"
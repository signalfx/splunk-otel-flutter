name: splunk_otel_flutter_session_replay_platform_interface
description: "Platform interface for Splunk session replay. Defines the API contract for session recording and playback functionality."
version: 1.1.0
repository: https://github.com/signalfx/splunk-otel-flutter/tree/main/packages/splunk_otel_flutter_session_replay/splunk_otel_flutter_session_replay_platform_interface
homepage: https://github.com/signalfx/splunk-otel-flutter

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.0
  # Locked to the 1.1.x line so the shared Pigeon codec stays version-aligned.
  # Bump together with the other packages every release.
  splunk_otel_flutter_platform_interface: '>=1.1.0 <1.2.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^26.0.1